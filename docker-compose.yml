name: stand-manager

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: standbot
      POSTGRES_USER: standbot
      POSTGRES_PASSWORD: standbot
    volumes:
      - standbot_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standbot -d standbot"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      DATABASE_URL: postgresql+asyncpg://standbot:standbot@postgres:5432/standbot
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  wow:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WOW_HOST_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/boss-mode/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  standbot_postgres_data:
